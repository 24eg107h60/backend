# ===================================================================
# Vehicle Service and Maintenance Prediction Platform Configuration
# ===================================================================
spring.application.name=vehicle-maintenance-platform
server.port=9090


# Profile selection: default uses in-memory H2 with full sample seed data.
# To switch to MySQL, start with --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=dev

# H2 Database configuration for out-of-the-box local execution
spring.datasource.url=jdbc:h2:mem:vehicle_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=9a67c7e69b47e2b10283b9e4a8c1752f9a67c7e69b47e2b10283b9e4a8c1752f
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.autocare.platform=INFO
logging.level.org.springframework.security=WARN
